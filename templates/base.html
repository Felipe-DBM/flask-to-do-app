<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Flask To-Do (Static Demo)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>

<body>
    <main class="container">
        <header class="header">
            <h1 class="logo">📝 Flask To-Do</h1>

    <footer class="footer">
        <small>Built with Flask &amp; SQLite</small>
    </footer>
</body>

</html>
